name: Generate Site
run-name: "Generate Site ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on: 
  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  generate-site:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        token: ${{ secrets.PUSH_TOKEN }}
    - name: Set up Python 3.11
      uses: actions/setup-python@v4.5.0
      with:
        python-version: 3.11
    - name: Install Poetry
      run: curl -sSL https://install.python-poetry.org | python -
    - name: Install dependencies with Poetry
      run: poetry install
    - name: Run Site Generation 
      run: poetry run python bin/site.py -v
    - name: Run Site Generation 
      run: poetry run python bin/gen-files.py
    - name: Commit Generated Data
      run: |
          git config --global user.name "Github Actions"
          git config --global user.email "robot@noreply.github.com"
          git config --global push.default simple
          git add .
          git commit -m "New site and hashes generated by GitHub Actions [ci skip]"
          git pull --rebase origin main
          git push
